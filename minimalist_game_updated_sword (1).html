<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Web Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .screen { width: 100%; height: 100%; position: absolute; top: 0; left: 0; background-color: #ffffff; display: flex; }
    .hidden { display: none !important; }
    #start-screen { justify-content: center; align-items: center; }
    .start-btn { padding: 18px 48px; font-size: 22px; font-weight: 700; color: #ffffff; background-color: #000000; border: 4px solid #000000; border-radius: 20px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.1); transition: background-color .2s ease, transform .1s ease; outline: none; }
    .start-btn:hover { background-color: #222222; }
    .start-btn:active { transform: scale(.96); }
    #game-screen, #region-screen { flex-direction: column; padding: 24px; position: relative; }
    .top-bar { width: 100%; position: absolute; top: 24px; left: 24px; z-index: 10; }
    .back-btn { width: 48px; height: 48px; border: 3px solid #000; background-color: #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; outline: none; transition: background-color .2s ease, transform .1s ease; }
    .back-btn:hover { background-color: #f5f5f5; }
    .back-btn:active { transform: scale(.92); }
    .back-btn svg { width: 24px; height: 24px; fill: #000; }
    .bottom-right-bar { position: absolute; bottom: 28px; right: 32px; z-index: 10; }
    .action-btn { padding: 14px 32px; font-size: 18px; font-weight: 700; color: #fff; background-color: #000; border: 3px solid #000; border-radius: 14px; cursor: pointer; outline: none; box-shadow: 0 4px 14px rgba(0,0,0,.1); transition: background-color .2s ease, transform .1s ease; }
    .action-btn:hover { background-color: #222; }
    .action-btn:active { transform: scale(.96); }
    .game-area { flex: 1; display: flex; align-items: center; justify-content: flex-start; gap: 28px; width: 100%; height: 100%; padding: 80px 40px 60px; overflow-x: auto; overflow-y: hidden; cursor: grab; scrollbar-width: none; }
    .game-area::-webkit-scrollbar { display: none; }
    .game-area.active { cursor: grabbing; }
    .card-container { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
    .card-label { font-size: 22px; font-weight: 800; color: #000; margin-bottom: 12px; letter-spacing: -.5px; }
    .card-box { width: 240px; height: 336px; border: 4px solid #000; border-radius: 20px; background-color: #fff; display: flex; flex-direction: column; position: relative; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,.08); transition: transform .2s ease, box-shadow .2s ease; }
    .card-box.clickable { cursor: pointer; }
    .card-box.clickable:hover { transform: translateY(-4px); box-shadow: 0 10px 24px rgba(0,0,0,.15); }
    .card-box.selected { transform: translateY(-14px) !important; border-color: #000; box-shadow: 0 14px 28px rgba(0,0,0,.22); }
    .card-box.disabled { opacity: .4; cursor: not-allowed; }
    .card-square { width: 100%; height: 210px; border-bottom: 4px solid #000; display: flex; justify-content: center; align-items: center; background-color: #fff; }
    .card-img { width: 78%; height: 78%; object-fit: contain; }
    .card-stats { flex: 1; padding: 8px 14px; display: flex; flex-direction: column; justify-content: center; gap: 4px; font-size: 13px; font-weight: 700; color: #000; }
    .stat-item { display: flex; align-items: center; }
    .region-area { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; padding-top: 40px; overflow-x: auto; }
    .region-card-container { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
    .region-card-box { width: 720px; max-width: 90vw; height: 336px; border: 4px solid #000; border-radius: 20px; background-color: #fff; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,.08); }
    .region-card-square { width: 100%; height: 232px; border-bottom: 4px solid #000; background-color: #fff; display: flex; justify-content: center; align-items: center; }
  </style>
</head>

  <script>
    const startScreen=document.getElementById('start-screen');
    const gameScreen=document.getElementById('game-screen');
    const regionScreen=document.getElementById('region-screen');
    const startBtn=document.getElementById('start-btn');
    const backToStartBtn=document.getElementById('back-to-start-btn');
    const goRegionBtn=document.getElementById('go-region-btn');
    const backToCharBtn=document.getElementById('back-to-char-btn');
    const warriorCard=document.getElementById('warrior-card');
    const wizardCard=document.getElementById('wizard-card');
    const gameArea=document.getElementById('game-area');
    startBtn.addEventListener('click',()=>{startScreen.classList.add('hidden');gameScreen.classList.remove('hidden');});
    backToStartBtn.addEventListener('click',()=>{gameScreen.classList.add('hidden');startScreen.classList.remove('hidden');});
    goRegionBtn.addEventListener('click',()=>{gameScreen.classList.add('hidden');regionScreen.classList.remove('hidden');});
    backToCharBtn.addEventListener('click',()=>{regionScreen.classList.add('hidden');gameScreen.classList.remove('hidden');});
    let isMouseDown=false,startX,scrollLeft,dragged=false;
    gameArea.addEventListener('mousedown',(e)=>{isMouseDown=true;dragged=false;gameArea.classList.add('active');startX=e.pageX-gameArea.offsetLeft;scrollLeft=gameArea.scrollLeft;});
    gameArea.addEventListener('mouseleave',()=>{isMouseDown=false;gameArea.classList.remove('active');});
    gameArea.addEventListener('mouseup',()=>{isMouseDown=false;gameArea.classList.remove('active');});
    gameArea.addEventListener('mousemove',(e)=>{if(!isMouseDown)return;e.preventDefault();const x=e.pageX-gameArea.offsetLeft;const walk=(x-startX)*1.5;if(Math.abs(walk)>5)dragged=true;gameArea.scrollLeft=scrollLeft-walk;});
    function selectCard(cardToSelect){if(dragged)return;warriorCard.classList.remove('selected');wizardCard.classList.remove('selected');cardToSelect.classList.add('selected');}
    warriorCard.addEventListener('click',()=>selectCard(warriorCard));
    wizardCard.addEventListener('click',()=>selectCard(wizardCard));
  </script>
